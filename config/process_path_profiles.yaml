# Process-path backend profiles (documentation / future config-driven selection).
#
# pilz_sequence       : LIN/CIRC segments chained via the Pilz MoveGroupSequence
#                       action (sequence_move_group) with optional blending.
# cartesian_waypoints : dense cartesian path via computeCartesianPath + TOTG/Ruckig
#                       retiming. Secondary on FR3WML (KDL Cartesian is fragile).

pilz_sequence:
  action: sequence_move_group
  pipeline: pilz_industrial_motion_planner
  supports_blending: true
  supports_circular: true

cartesian_waypoints:
  eef_step: 0.005
  jump_threshold: 0.0
  fraction_threshold: 1.0      # accept only complete paths unless allow_partial
  retime: totg                 # then optional ruckig smoothing
  supports_circular: false     # approximated by dense sampling
