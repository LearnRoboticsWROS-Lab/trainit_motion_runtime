# The application's TASKS (tasks.yaml schema 1), generated by the TrainIt Setup Assistant from the
# project's Canonical Task Program: a MANIFEST -- each task's stable name, its BehaviorTree (in
# bt_trees/task_program.xml), and the data it takes and gives. trainit_run_bt runs MainTree as before;
# the robot task server (trainit_task_server, ADR-0032) READS this file: every task with an `export` is
# a robot capability the cell's PLC may request by its PLC task number (a job runs job_<task>) within its
# timeout_s; export_table_id is the CRC-32 of that table -- regenerate the PLC side whenever it changes.
# A task's inputs and outputs are data on the application's one blackboard, by name: a candidate set
# (a detect step's out) or a capture (a capture's out).
schema_version: 1
main_task: place_part
export_table_id: 3767158916   # CRC-32 of the exported-task table (ADR-0032 Decision 3)
tasks:
  place_part:
    tree: task_place_part
    description: "Place a part (the P0.a fixture's long job)"
    inputs: []
    outputs: []
    export: {number: 12, timeout_s: 30.0}
  home:
    tree: task_home
    description: "Go home with the tool open (the recovery task)"
    inputs: []
    outputs: []
    export: {number: 7, timeout_s: 5.0}
  pick_part:
    tree: task_pick_part
    description: "Pick a part (ends holding it)"
    inputs: []
    outputs: []
    export: {number: 3, timeout_s: 10.0}
  carry:
    tree: task_carry
    description: "Carry whatever is held (no tool step)"
    inputs: []
    outputs: []
    export: {number: 4, timeout_s: 10.0}
  inspect:
    tree: task_inspect
    inputs: []
    outputs: []
