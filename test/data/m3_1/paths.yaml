# vNext M3.1 (ADR-0024): a path library for the test arm (test/m2_5/test_arm.hpp). The arm's start
# pose (q = 0) puts the tcp at (0.5, 0, 0.3) in base_link with the identity orientation: every path
# starts there. W1 -LIN-> W2 -CIRC-> W3 -LIN-> W4, stopped and blended, by inline poses and by
# waypoints; the centre form of CIRC; two dense sources.
schema_version: 1
paths:
  lcl_blend:
    continuity: blend
    goal_tolerance: {position_m: 0.0005, orientation_rad: 0.005}
    states:
      - {pose: {position: [0.5, 0.0, 0.3], orientation: [0.0, 0.0, 0.0, 1.0]}}
      - {pose: {position: [0.5, 0.1, 0.3], orientation: [0.0, 0.0, 0.0, 1.0]}}
      - {pose: {position: [0.5, 0.2, 0.2], orientation: [0.0, 0.0, 0.0, 1.0]}}
      - {pose: {position: [0.4, 0.2, 0.2], orientation: [0.0, 0.0, 0.0, 1.0]}}
    segments:
      - {type: lin, blend_radius_m: 0.02}
      - {type: circ, via: {position: [0.5, 0.17, 0.27]}, velocity_scaling: 0.1, blend_radius_m: 0.02}
      - {type: lin, profile: transit}
  lcl_stop:
    continuity: stop
    profile: process
    states:
      - {pose: {position: [0.5, 0.0, 0.3], orientation: [0.0, 0.0, 0.0, 1.0]}}
      - {pose: {position: [0.5, 0.1, 0.3], orientation: [0.0, 0.0, 0.0, 1.0]}}
      - {pose: {position: [0.5, 0.2, 0.2], orientation: [0.0, 0.0, 0.0, 1.0]}}
      - {pose: {position: [0.4, 0.2, 0.2], orientation: [0.0, 0.0, 0.0, 1.0]}}
    segments:
      - {type: lin}
      - {type: circ, via: {position: [0.5, 0.17, 0.27]}}
      - {type: lin}
  by_waypoints:
    continuity: blend
    states: [{waypoint: w1}, {waypoint: w2}, {waypoint: w3}, {waypoint: w4}]
    segments:
      - {type: lin, blend_radius_m: 0.01}
      - {type: circ, via: {waypoint: w2b}, blend_radius_m: 0.01}
      - {type: lin}
  circ_center:
    states:
      - {pose: {position: [0.5, 0.0, 0.3], orientation: [0.0, 0.0, 0.0, 1.0]}}
      - {pose: {position: [0.5, 0.1, 0.3], orientation: [0.0, 0.0, 0.0, 1.0]}}
      - {pose: {position: [0.5, 0.2, 0.2], orientation: [0.0, 0.0, 0.0, 1.0]}}
    segments:
      - {type: lin}
      - {type: circ, center: {position: [0.5, 0.1, 0.2]}}
  in_tool_frame:
    frame: tcp_frame
    states:
      - {pose: {position: [0.0, 0.0, 0.0], orientation: [0.0, 0.0, 0.0, 1.0]}}
      - {pose: {position: [0.0, 0.05, 0.0], orientation: [0.0, 0.0, 0.0, 1.0]}}
    segments: [{type: lin}]
  elsewhere:
    states:
      - {pose: {position: [0.3, 0.0, 0.3], orientation: [0.0, 0.0, 0.0, 1.0]}}
      - {pose: {position: [0.3, 0.1, 0.3], orientation: [0.0, 0.0, 0.0, 1.0]}}
    segments: [{type: lin}]
  dense_stop:
    continuity: stop
    source: {file: bead.csv, orientation: [0.0, 0.0, 0.0, 1.0]}
  dense_yaml_stop:
    source: {file: bead.yaml}
