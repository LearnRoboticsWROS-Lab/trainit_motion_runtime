# BehaviorTree application parameters (consumed by trainit_run_bt), generated by the TrainIt Setup
# Assistant from a Canonical Task Program. task_parameters holds the WAYPOINTS: each entry is a
# target (WHERE) and the move that reaches it (motion, planner, profile, speed and accel in percent);
# the comment above an entry names the steps that use it and the PROVIDER TSA resolved for them; a
# ptp or free move's `planner` key is that provider's planner MODE (what MoveWaypoint reads: provider
# pilz_ptp -> planner pilz, ompl -> ompl), a lin or circ move has none (always Pilz LIN / CIRC). The
# paths are config/paths.yaml, the profiles config/motion_profiles.yaml, the tasks
# bt_trees/task_program.xml.
/**:
  ros__parameters:
    # every ptp and free move names its own planner: planner_mode is the free provider's
    planner_mode: "ompl"
    # cartesian_waypoints iff a path runs on that provider (TSA derives it from the paths)
    process_path_backend: "pilz_sequence"
    group: "ur_manipulator"
    base_frame: "base_link"
    tip_link: "tcp"
    # fixed for every task program (not authored): no legacy gripper action, the mock process
    # controller (no process events yet), MainTree, and the runtime's trajectory validation on
    gripper_action: ""
    process_controller: "mock"
    bt_tree_id: "MainTree"
    enforce_validation: true
    # The end-effector contract (ADR-0022): every actuator, grasp site and the verification
    # policy, resolved. trainit_run_bt and the device's adapter read this same block.
    eef:
      ids: ["main"]
      main:
        actuator_ids: ["vacuum"]
        site_ids: ["main"]
        command_timeout_ms: 10000
        scene_signal: "adapter"
        actuators:
          vacuum:
            command_interface: "set_bool"
            actuation_feedback: false
            confirm_timeout_ms: 2000
        sites:
          main:
            grip: "vacuum"
            engage: "engage"
            release: "release"
        verification:
          require_grasp_confirmation: true
          require_release_confirmation: true
          accepted_evidence: ["sensor", "sim_ground_truth"]
          timeout_ms: 3000
          max_age_ms: 500
          clock_tolerance_ms: 100

    task_parameters:
      scene_table_dims: [1.2, 1.2, 0.05]
      scene_table_pos: [0.3, 0.0, -0.03]

      pick_nominal:
        type: tcp
        position: [0.4, 0.0, 0.3]
        orientation: [1.0, 0.0, 0.0, 0.0]

      place:
        type: tcp
        position: [0.3, -0.3, 0.15]
        orientation: [1.0, 0.0, 0.0, 0.0]

      # PreGrasp of task 'validation_c' step 2: set at run time from candidate 0 of 'parts' (SetWaypointFromCandidate, orientation align_approach on 'pick_nominal')
      # PTP, profile transit, provider pilz_ptp (the registry default for ptp)
      validation_c__s2_pregrasp:
        type: tcp
        motion: ptp
        planner: pilz
        profile: "transit"
        speed: 50
        accel: 50

      # the grasp pose (Approach) of task 'validation_c' step 2: set at run time from candidate 0 of 'parts' (SetWaypointFromCandidate, orientation align_approach on 'pick_nominal')
      # LIN, profile approach, provider pilz_lin (the registry default for lin)
      validation_c__s2_grasp:
        type: tcp
        motion: lin
        profile: "approach"
        speed: 20
        accel: 20

      # Retract of task 'validation_c' step 2: set at run time from candidate 0 of 'parts' (SetWaypointFromCandidate, orientation align_approach on 'pick_nominal')
      # LIN, profile approach, provider pilz_lin (the registry default for lin)
      validation_c__s2_retract:
        type: tcp
        motion: lin
        profile: "approach"
        speed: 20
        accel: 20

      # PreRelease of task 'validation_c' step 3: 'place' - 0.05 m along its tool +Z (target_local) (resolved by TSA)
      # PTP, profile transit, provider pilz_ptp (the registry default for ptp)
      validation_c__s3_prerelease:
        type: tcp
        position: [0.3, -0.3, 0.2]
        orientation: [1.0, 0.0, 0.0, 0.0]
        motion: ptp
        planner: pilz
        profile: "transit"
        speed: 50
        accel: 50

      # the release pose of task 'validation_c' step 3: 'place' (resolved by TSA)
      # LIN, profile approach, provider pilz_lin (the registry default for lin)
      validation_c__s3_release:
        type: tcp
        position: [0.3, -0.3, 0.15]
        orientation: [1.0, 0.0, 0.0, 0.0]
        motion: lin
        profile: "approach"
        speed: 20
        accel: 20

      # Retract of task 'validation_c' step 3: 'place' + 0.08 m up its frame's +Z (resolved by TSA)
      # LIN, profile approach, provider pilz_lin (the registry default for lin)
      validation_c__s3_retract:
        type: tcp
        position: [0.3, -0.3, 0.23]
        orientation: [1.0, 0.0, 0.0, 0.0]
        motion: lin
        profile: "approach"
        speed: 20
        accel: 20
