# =============================================================================
# planner_profiles.yaml -- THE planner registry of TrainIt (vNext M2.1, ADR-0021).
#
# Which planners exist, and what every planner token means, is written HERE.
# Everything that needs the vocabulary reads this file or is tested against it:
#
#   trainit_moveit_config.py   READS it: the pipelines move_group loads (in this
#                              order), their parameter files, the default pipeline.
#   C++ PlannerMode, its token table, ManualMotionStrategySelector, the defaults
#                              are the MAPPING of this registry onto MoveIt, in
#                              code (owner decision, M2.1 option A);
#                              test_planner_registry checks them entry by entry.
#   TSA                        reads a byte COPY of it, committed in its catalog
#                              (catalog/tmr_planner_registry.yaml) -- never this
#                              file while it generates -- and its parity test fails
#                              when the two differ.
#
# Adding a planner = an entry here (+ its config/pipelines/ file) + its token and
# its selector case in C++, then a TSA catalog refresh; the tests name whatever is
# missing. Candidate providers (cuMotion, cuRobo, ...) are NOT entries: they are
# external metadata in TSA's candidate catalog (ADR-0019).
#
# Schema 2 (vNext M3.1, ADR-0025) is schema 1 plus three sections at the end:
# `capabilities`, `providers` and `provider_defaults` -- what each MoveIt ROUTE can honour.
# Nothing above them changed; a reader that maps only schema 1 refuses this file by its
# number instead of half-reading it.
# =============================================================================
schema_version: 2

# MoveIt planning pipelines. `loaded: true` = in the DEFAULT loaded set: move_group
# loads it in every TrainIt cell (planning_pipelines, in this order) and the
# runtime's availability guard counts it as available. A cell cannot choose its
# own set yet (ADR-0020). `parameters` is the file under config/pipelines/.
pipelines:
  ompl:
    plugin_package: moveit_planners_ompl
    parameters: ompl_planning.yaml
    loaded: true
  pilz_industrial_motion_planner:
    plugin_package: pilz_industrial_motion_planner
    parameters: pilz_industrial_motion_planner_planning.yaml
    loaded: true
  chomp:
    plugin_package: moveit_planners_chomp
    parameters: chomp_planning.yaml
    loaded: true
  stomp:
    plugin_package: moveit_planners_stomp
    parameters: null            # MoveIt on Humble has no STOMP plugin: never loaded
    loaded: false
default_pipeline: ompl          # move_group default_planning_pipeline

# planner_mode tokens (bt_params `planner_mode`, a waypoint's `planner`): what the
# selector resolves a FREE-SPACE move (intent PTP / COLLISION_FREE) to -- TMR's
# PlannerProfile. A mode is DELIVERABLE when its pipeline, and its optimizer
# pipeline if it has one, are loaded; any other mode degrades at runtime to
# `degrades_to`. TSA offers a project only the deliverable, `stable` modes.
# Code, not data (pinned by test_planner_resolution_identity): the OMPL upgrade to
# the optimizer stage for intent COLLISION_FREE_OPTIMIZED, and ONLINE_SERVO.
planner_modes:
  pilz:
    pipeline: pilz_industrial_motion_planner
    planner: PTP                # joint interpolation: collision-CHECKED, not avoiding
    stability: stable
  ompl:
    pipeline: ompl
    planner: RRTConnectkConfigDefault
    stability: stable
  ompl_chomp:
    pipeline: ompl
    planner: RRTConnectkConfigDefault
    # Two-stage in PlannerProfile terms. MoveIt 2.5 ships no CHOMP optimizer adapter,
    # so the runtime does not chain OMPL into CHOMP: it tries this pipeline FIRST,
    # standalone (planner id ""), and falls back to pipeline/planner above when it fails.
    optimizer_pipeline: chomp
    degrades_to: ompl           # when the optimizer pipeline is not loaded
    stability: stable
  stomp:
    pipeline: stomp
    planner: STOMP
    degrades_to: ompl           # its pipeline is never loaded on Humble
    stability: experimental
default_planner_mode: pilz      # when nothing sets planner_mode

# Cartesian shapes do not follow the mode: always Pilz.
cartesian:
  linear:       {pipeline: pilz_industrial_motion_planner, planner: LIN}
  circular:     {pipeline: pilz_industrial_motion_planner, planner: CIRC}
  process_path: {pipeline: pilz_industrial_motion_planner, planner: LIN}

# HOW a move is executed (ADR-0015), and the BT node that executes it. A planner
# applies only to a planned move. MoveIt-realised modes only: a learned policy
# (ADR-0005) is run by the Pro trainit_policy_runtime behind TMR's torch-free
# RunPolicy BT node, never an entry here.
execution:
  plan:  {planned: true, node: MoveWaypoint}    # plan the trajectory, then execute it
  servo: {planned: false, node: ServoTrack}     # MoveIt Servo streams it; no planner applies

# --- schema 2 (vNext M3.1, ADR-0025): motion provider capabilities ---------------------------
# The application states INTENT and LIMITS; a provider implements them. A provider is a ROW
# here -- one MoveIt route as TMR drives it -- never a class. `provides` lists what a step served
# by that route may REQUIRE; a step that requires a token its provider lacks is refused before
# it moves (TMR's path library today; TSA's capability resolution from M3.2). A token joins a
# row in the commit that makes the route honour it, never before. The application never names
# a velocity-profile shape: `time_parameterization` is informational provider metadata.
# The C++ mirror is motion_providers.cpp (option A of ADR-0021 Decision 4), checked entry by
# entry against this file by test_planner_registry.
# Who consumes a token today: TMR's path library refuses a path whose provider lacks one of
# multi_segment_path, blending, cartesian_linear, cartesian_circular, continuous_path,
# velocity_scaling, acceleration_scaling, goal_tolerance; TSA's capability resolution (vNext M3.2)
# consumes every token, joint_ptp, collision_free_planning, tcp_limits and process_path included
# (tcp_limits is honoured by MoveIt's Pilz Cartesian limits, not by TMR code).
capabilities:
  # live: provided by at least one row below
  live: [joint_ptp, collision_free_planning, cartesian_linear, cartesian_circular,
         multi_segment_path, blending, continuous_path, velocity_scaling, acceleration_scaling,
         tcp_limits, goal_tolerance, process_path]
  # reserved: declared so that a request for one is REFUSED by name; no row provides them
  reserved: [orientation_constraints, jerk_constraints, precomputed_trajectory]

# goal_tolerance: the motion_sequence rows send the request's goal tolerance in every item; the
# plan_and_execute rows send it since vNext M3.4 (TMR 2.3.0) for a POSE goal (a joint target's
# Cartesian tolerance is refused at run time); cartesian_path has no goal tolerance.
# Each row names its route and points into the sections above (`planner_mode` or `cartesian`)
# instead of repeating their pipeline/planner. Routes:
#   plan_and_execute  MoveGroupInterface plan -> TMR validation -> execution (MotionRuntime's
#                     movePtp / moveLinear / moveCollisionFree)
#   motion_sequence   ONE Pilz MoveGroupSequence goal (plan + execute), LIN/CIRC items, a blend
#                     radius per item, the last always 0 (executeProcessSequence)
#   cartesian_path    computeCartesianPath + TOTG retiming through every sample: a continuous
#                     Cartesian path (executeCartesianProcess, cartesian_waypoints backend)
providers:
  pilz_ptp:
    route: plan_and_execute
    planner_mode: pilz
    provides: [joint_ptp, velocity_scaling, acceleration_scaling, goal_tolerance]
    time_parameterization: pilz_trapezoidal
    stability: stable
  ompl:
    route: plan_and_execute
    planner_mode: ompl
    provides: [collision_free_planning, velocity_scaling, acceleration_scaling, goal_tolerance]
    time_parameterization: totg
    stability: stable
  ompl_chomp:
    route: plan_and_execute
    planner_mode: ompl_chomp
    provides: [collision_free_planning, velocity_scaling, acceleration_scaling, goal_tolerance]
    time_parameterization: totg
    stability: stable
  pilz_lin:
    route: plan_and_execute
    cartesian: linear
    provides: [cartesian_linear, velocity_scaling, acceleration_scaling, tcp_limits, goal_tolerance]
    time_parameterization: pilz_trapezoidal
    stability: stable
  pilz_circ:
    route: motion_sequence
    cartesian: circular
    provides: [cartesian_circular, velocity_scaling, acceleration_scaling, tcp_limits,
               goal_tolerance]
    time_parameterization: pilz_trapezoidal
    stability: stable
  # Folded from config/process_path_profiles.yaml (pilz_sequence: supports_blending,
  # supports_circular), which is now only a pointer here.
  pilz_sequence:
    route: motion_sequence
    cartesian: process_path
    provides: [multi_segment_path, blending, cartesian_linear, cartesian_circular,
               velocity_scaling, acceleration_scaling, tcp_limits, goal_tolerance, process_path]
    time_parameterization: pilz_trapezoidal
    stability: stable
  # Folded from config/process_path_profiles.yaml (cartesian_waypoints): the numbers are the
  # backend's defaults (cartesian_waypoint_backend.hpp, MoveItMotionRuntime::Config).
  cartesian_waypoints:
    route: cartesian_path
    provides: [continuous_path, velocity_scaling, acceleration_scaling]
    time_parameterization: totg
    smoothing: ruckig_optional
    eef_step_m: 0.005
    jump_threshold: 0.0
    fraction_threshold: 1.0
    stability: stable

# The row a step of each kind gets when nothing chooses one. `free` is a collision-AVOIDING
# move, so it defaults to a sampling planner, not to default_planner_mode (whose Pilz PTP only
# CHECKS collisions); `dense_path` is a sampled path executed as one continuous motion.
provider_defaults:
  ptp: pilz_ptp
  free: ompl
  lin: pilz_lin
  circ: pilz_circ
  path: pilz_sequence
  dense_path: cartesian_waypoints
